<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="16" y1="16" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield Path -->
  <path d="M24 4L7 11V23C7 33.5 14.3 43.1 24 46C33.7 43.1 41 33.5 41 23V11L24 4Z" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="#0B101D" 
        fill-opacity="0.8" />
  
  <!-- Inner Lens Rings -->
  <circle cx="24" cy="22" r="11" stroke="url(#lensGrad)" stroke-width="2" stroke-dasharray="2 2" opacity="0.6" />
  <circle cx="24" cy="22" r="8" stroke="url(#shieldGrad)" stroke-width="2.2" filter="url(#glow)" />
  
  <!-- Focal Reticle / Center Pupil -->
  <circle cx="24" cy="22" r="3.5" fill="#00E5FF" />
  <path d="M24 10V14M24 30V34M12 22H16M32 22H36" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" opacity="0.8" />
</svg>
